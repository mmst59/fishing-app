<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник Рыбака</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 pb-12">
    <!-- Шапка -->
    <div class="flex items-center justify-between mb-6 border-b border-slate-700 pb-3">
        <h1 class="text-xl font-bold text-amber-400">🎣 Дневник Рыбака</h1>
        <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-400" id="username">Гость</span>
    </div>

    <!-- Календарь -->
    <div class="bg-slate-800 rounded-2xl p-4 shadow-lg mb-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-lg text-slate-200">Календарь Клёва</h2>
            <span class="text-xs text-emerald-400 bg-emerald-950/60 px-2 py-1 rounded border border-emerald-800">Благоприятный день</span>
        </div>
        <div class="grid grid-cols-7 gap-2 text-center text-xs text-slate-400 mb-2">
            <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>
        <div class="grid grid-cols-7 gap-2 text-center text-sm font-semibold">
            <div class="p-2 rounded bg-slate-700/50 text-slate-500">22</div>
            <div class="p-2 rounded bg-amber-500/20 text-amber-300 border border-amber-500/50">23</div>
            <div class="p-2 rounded bg-slate-700/30">24</div>
            <div class="p-2 rounded bg-slate-700/30">25</div>
            <div class="p-2 rounded bg-slate-700/30">26</div>
            <div class="p-2 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/50">27</div>
            <div class="p-2 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/50">28</div>
        </div>
    </div>

    <!-- Форма записи улова -->
    <div class="bg-slate-800 rounded-2xl p-4 shadow-lg mb-6">
        <h2 class="font-bold text-lg mb-3 text-slate-200">Записать улов</h2>
        <form id="catchForm" class="space-y-3">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Вид рыбы и вес</label>
                <input type="text" id="fishInput" required placeholder="Например: Щука 2.5 кг" class="w-full bg-slate-700 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Наманка / Наживка</label>
                <input type="text" id="baitInput" placeholder="Например: Воблер 110мм" class="w-full bg-slate-700 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl shadow-md transition active:scale-95">
                Сохранить в дневник
            </button>
        </form>
    </div>

    <!-- История уловов -->
    <div class="bg-slate-800 rounded-2xl p-4 shadow-lg">
        <h2 class="font-bold text-lg mb-3 text-slate-200">Мои уловы</h2>
        <div id="catchesList" class="space-y-2">
            <p class="text-xs text-slate-500 text-center py-2" id="emptyText">Уловов пока нет. Заполни форму выше!</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe?.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        const catchForm = document.getElementById('catchForm');
        const catchesList = document.getElementById('catchesList');
        const emptyText = document.getElementById('emptyText');

        // Загрузка сохраненных записей
        function loadCatches() {
            const saved = JSON.parse(localStorage.getItem('my_catches') || '[]');
            if (saved.length > 0) emptyText.style.display = 'none';
            
            catchesList.innerHTML = '';
            saved.forEach(item => {
                const el = document.createElement('div');
                el.className = 'bg-slate-700/50 p-3 rounded-xl border border-slate-600 flex justify-between items-center';
                el.innerHTML = `
                    <div>
                        <div class="font-bold text-amber-300 text-sm">${item.fish}</div>
                        <div class="text-xs text-slate-400">Наживка: ${item.bait || 'Не указана'}</div>
                    </div>
                    <div class="text-xs text-slate-500">${item.date}</div>
                `;
                catchesList.appendChild(el);
            });
        }

        // Обработка отправки формы
        catchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const fish = document.getElementById('fishInput').value;
            const bait = document.getElementById('baitInput').value;
            const date = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

            const saved = JSON.parse(localStorage.getItem('my_catches') || '[]');
            saved.unshift({ fish, bait, date });
            localStorage.setItem('my_catches', JSON.stringify(saved));

            document.getElementById('fishInput').value = '';
            document.getElementById('baitInput').value = '';

            loadCatches();
            tg.HapticFeedback?.notificationOccurred('success'); // Легкая вибрация телефона при успехе
        });

        loadCatches();
    </script>
</body>
</html>
