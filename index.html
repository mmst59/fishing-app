<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник Охоты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 pb-12 font-sans">

    <!-- Шапка -->
    <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-3">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🎣</span>
            <div>
                <h1 class="text-base font-bold text-amber-400 leading-none">Дневник Рыбалки</h1>
                <span class="text-[10px] text-slate-400">Street Field Tracker</span>
            </div>
        </div>
        <span class="text-xs bg-slate-800 px-2 py-1 rounded-lg text-slate-300 border border-slate-700" id="username">Рыбак</span>
    </div>

    <!-- Форма фиксации подхода -->
    <div class="bg-slate-800 rounded-2xl p-4 shadow-lg mb-6 border border-slate-700">
        <h2 class="font-bold text-base mb-3 text-slate-200 flex items-center justify-between">
            <span>Зафиксировать подход</span>
            <span class="text-xs font-normal text-amber-400">🎯 Трекер</span>
        </h2>
        <form id="approachForm" class="space-y-3">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Кем была / Имя</label>
                <input type="text" id="targetInput" required placeholder="Например: Вика / Брюнетка" class="w-full bg-slate-700/70 border border-slate-600 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Результат подхода</label>
                <select id="statusSelect" class="w-full bg-slate-700/70 border border-slate-600 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-500 text-white">
                    <option value="success">🟢 Успех! Взял ТГ / Номер</option>
                    <option value="reject">🔴 Отшив / Отказ</option>
                    <option value="date">🟡 Договорились на свидание</option>
                </select>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Детали / Причина / Опенер</label>
                <input type="text" id="noteInput" placeholder="Например: Есть парень" class="w-full bg-slate-700/70 border border-slate-600 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-extrabold py-3 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center space-x-2">
                <span>Записать подход 🎯</span>
            </button>
        </form>
    </div>

    <script>
        const BOT_TOKEN = "8828579591:AAH9F43eq0POe4Gz-yHLjGG6K0HnssIUYus";
        const tg = window.Telegram.WebApp;
        tg.expand();

        let userId = null;
        let userName = "Рыбак";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
            userName = tg.initDataUnsafe.user.first_name;
            document.getElementById('username').innerText = userName;
        }

        const approachForm = document.getElementById('approachForm');
        const submitBtn = document.getElementById('submitBtn');

        approachForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Сохранение...";

            const target = document.getElementById('targetInput').value;
            const status = document.getElementById('statusSelect').value;
            const note = document.getElementById('noteInput').value;

            let statusText = "🟢 Взял ТГ/Номер";
            if (status === "reject") statusText = "🔴 Отшив";
            if (status === "date") statusText = "🟡 Свидание";

            const textMessage = `🎯 **НОВЫЙ ПОДХОД ЗАФИКСИРОВАН!**\n\n` +
                                `👤 **Девушка:** ${target}\n` +
                                `📌 **Результат:** ${statusText}\n` +
                                `📝 **Заметка:** ${note ? note : "Нет"}\n\n` +
                                `__Запись сохранена из WebApp__`;

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            // Если зашли из Telegram и знаем ID юзера
            if (userId) {
                try {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: userId,
                            text: textMessage,
                            parse_mode: 'Markdown'
                        })
                    });
                } catch (err) {
                    console.error("Ошибка отправки API:", err);
                }
            } else {
                alert("Данные сохранены! (Запусти через Telegram для отчета в чат)");
            }

            // Закрываем окно WebApp
            tg.close();
        });
    </script>
</body>
</html>
